name: AutoForge Multi-Portal Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install & Build Vanilla Game
        run: |
          cd game-template
          npm install
          npm run build
          
      # ---------------------------------------------------
      # 1. DEPLOY TO ITCH.IO (QA & Testing)
      # ---------------------------------------------------
      - name: Download itch.io Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          
      - name: Push to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: ./butler push game-template/dist your-username/autoforge-game:html5 [cite: 1.3.1]
        
      # ---------------------------------------------------
      # 2. INJECT SDK & PREPARE CRAZYGAMES BUILD
      # ---------------------------------------------------
      - name: Inject CrazyGames SDK
        run: |
          # Use a bash script to insert <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script> into index.html
          # and append window.CrazyGames.SDK.init(); to the javascript build [cite: 1.1.1].
          bash inject_cg_sdk.sh game-template/dist
          
      - name: Archive Production Artifact
        uses: actions/upload-artifact@v3
        with:
          name: crazygames-production-build
          path: game-template/dist/
